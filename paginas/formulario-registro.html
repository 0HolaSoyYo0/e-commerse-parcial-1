<!DOCTYPE html>
<html lang="es-CL">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta</title>
    <link rel="stylesheet" href="/estilos/form-registro.css">
</head>
<body>

    <section class="registro-contenedor">

        <h1>Crear Usuario</h1>

        <form class="registro-form">
            <div class="campo-registro">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre">
            </div>
            
            <div class="campo-registro">
                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" name="apellido">
            </div>

            <div class="campo-registro">
                <label for="rut">RUT</label>
                <input type="text" id="rut" name="rut">
            </div>

            <div class="campo-registro">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario">
            </div>
            
            <div id="correo" class="campo-registro">
                <label for="correoElectronico">Email</label>
                <input type="email" id="correoElectronico" name="correo_electronico">
            </div>
            
            <div class="campo-registro">
                <label for="telefono">Telefono</label>
                <input type="tel" id="telefono" name="telefono">
            </div>

            <div class="campo-registro">
                <label for="direccion">Direccion</label>
                <input type="text" id="direccion" name="direccion">
            </div>

            <div class="campo-registro">
                <label for="fechaNacimiento">Fecha de Nacimiento</label>
                <input type="date" id="fechaNacimiento" name="fechaNacimiento">
            </div>

            <div class="boton-registro">
                <button type="submit">Crear</button>
            </div>
        </form>
    </section>
    
</body>
</html>
