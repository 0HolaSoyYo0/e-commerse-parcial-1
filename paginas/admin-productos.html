<!DOCTYPE html>
<html lang="es-CL">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mantenedor de productos</title>
    <link rel="stylesheet" href="../estilos/admin.css">
</head>

<body>
    <header>
        <a href="admin.html">Administración</a>
        <nav>
            <a href="admin-usuarios.html">Usuarios</a>
            <a href="../index.html">Salir</a>
        </nav>
    </header>

    <main>
        <h1>Mantenedor de productos</h1>
        <section>
            <h2>Crear producto</h2>
            <form>
                <p><label for="codigo">Código</label> <input type="text" id="codigo" name="codigo" minlength="3" required></p>
                <p><label for="nombre">Nombre</label> <input type="text" id="nombre" name="nombre" maxlength="100" required></p>
                <p><label for="descripcion">Descripción</label> <textarea id="descripcion" name="descripcion" maxlength="500"></textarea></p>
                <p><label for="precio">Precio</label> <input type="number" id="precio" name="precio" min="0" step="0.01" required></p>
                <p><label for="stock">Stock</label> <input type="number" id="stock" name="stock" min="0" step="1" required></p>
                <p><label for="categoria">Categoría</label>
                    <select id="categoria" name="categoria" required>
                        <option value="">Seleccionar</option>
                        <option value="fitness_musculacion">Fitness y Musculación</option>
                        <option value="running_atletismo">Running y Atletismo</option>
                        <option value="deportes_equipo">Deportes de Equipo</option>
                    </select>
                </p>
                <button type="submit">Guardar producto</button>
            </form>
        </section>

        <section>
            <h2>Productos registrados</h2>
            <p>Aquí se mostrará el listado para editar o eliminar productos.</p>
        </section>
    </main>
</body>

</html>
