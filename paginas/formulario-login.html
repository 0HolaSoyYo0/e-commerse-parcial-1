<!DOCTYPE html>
<html lang="es-CL">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="/estilos/form-login.css">
</head>
<body>

    <section class="contenedor">

        <h1>Iniciar Sesión</h1>

        <form class="formulario">
            <div class="entrada">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario">
            </div>

            <div class="entrada">
                <label for="contraseña">Contraseña</label>
                <input type="password" id="contraseña" name="contraseña" placeholder="******************">
            </div>

            <div class="boton-envio">
                <button id="iniciar" type="submit">Iniciar sesión</button>
            </div>
        </form>

        <footer class="pie-formulario">
            <p>¿No tienes cuenta?</p>
            <button id="registrar" type="button">Crea una</button>
        </footer>

    </section>
    
</body>
</html>
